name: CI — Product Catalog Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: product-catalog-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('product-catalog-service/**/build.gradle.kts', 'product-catalog-service/**/settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (domain + service layers)
        run: ./gradlew test --no-daemon

      - name: Run persistence integration tests (Testcontainers MySQL)
        run: ./gradlew integrationTest --no-daemon

      - name: Build application JAR
        run: ./gradlew bootJar --no-daemon -x test

      - name: Build Docker image (validation only, not pushed)
        run: docker build -t product-catalog-service:ci-check .

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            product-catalog-service/build/reports/tests/
            product-catalog-service/build/test-results/
          retention-days: 14
