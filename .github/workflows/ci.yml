# FILE: .github/workflows/ci.yml   (at GIT ROOT)

name: CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Unit/Slice Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./product-catalog-service

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle caches and wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('product-catalog-service/**/*.gradle.kts', 'product-catalog-service/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile ALL source sets
        run: ./gradlew --no-daemon compileJava compileTestJava compileIntegrationTestJava
        # Exists because of a real bug: bootRun compiles only src/main, so a
        # missing import in src/integrationTest (the @DirtiesContext incident)
        # was invisible until something compiled that source set.

      - name: Unit + controller slice tests
        run: ./gradlew --no-daemon test

      - name: JaCoCo coverage report
        run: ./gradlew --no-daemon jacocoTestReport

      - name: Upload test + coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-and-coverage-reports
          path: product-catalog-service/build/reports/
          retention-days: 14

  integration-tests:
    name: Integration Tests (Testcontainers MySQL 8.1)
    runs-on: ubuntu-24.04
    needs: build-and-test
    defaults:
      run:
        working-directory: ./product-catalog-service

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('product-catalog-service/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify Docker is available
        run: docker version

      - run: chmod +x gradlew

      - name: Run Testcontainers integration tests
        run: ./gradlew --no-daemon integrationTest

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: integration-test-reports
          path: product-catalog-service/build/reports/tests/integrationTest/
          retention-days: 14

